name: DARK MYRAA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    name: Build DARK MYRAA Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find Project Folder
        shell: pwsh
        run: |
          if (Test-Path "myraa_exact/package.json") {
            "PROJECT_DIR=myraa_exact" >> $env:GITHUB_ENV
          }
          elseif (Test-Path "package.json") {
            "PROJECT_DIR=." >> $env:GITHUB_ENV
          }
          else {
            throw "package.json not found. Upload the complete project."
          }

      - name: Install Dependencies
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE/$env:PROJECT_DIR"
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build DARK MYRAA APK
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE/$env:PROJECT_DIR"
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-android.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DARK-MYRAA-ANDROID-APK
          path: ${{ env.PROJECT_DIR }}/artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 7
          
