name: DARK MYRAA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    name: Build DARK MYRAA Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Detect Project Folder
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path . -Filter package.json -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '[\\/](node_modules|\.git)[\\/]'
            })

          if ($files.Count -eq 0) {
            throw "No package.json found. Upload the actual Android project source first."
          }

          $candidates = @($files | Where-Object {
            Test-Path (Join-Path $_.DirectoryName "package-lock.json") -and
            Test-Path (Join-Path $_.DirectoryName "scripts/build-android.ps1")
          })

          if ($candidates.Count -ne 1) {
            $files | ForEach-Object { Write-Host $_.FullName }
            throw "Could not uniquely identify Android project folder."
          }

          $projectDir = $candidates[0].DirectoryName
          $relativeDir = [System.IO.Path]::GetRelativePath(
            $env:GITHUB_WORKSPACE, $projectDir
          )

          if ($relativeDir -eq ".") {
            $relativeDir = ""
          }

          "PROJECT_DIR=$relativeDir" >> $env:GITHUB_ENV
          Write-Host "Project folder: $relativeDir"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Verify Build Files
        shell: pwsh
        run: |
          $p = Join-Path $env:GITHUB_WORKSPACE $env:PROJECT_DIR

          if (!(Test-Path "$p/package-lock.json")) {
            throw "package-lock.json missing"
          }

          if (!(Test-Path "$p/scripts/build-android.ps1")) {
            throw "Android build script missing"
          }

          if (!(Test-Path "$p/assets/characters/evelyn")) {
            throw "Required Evelyn model files missing"
          }

      - name: Install Dependencies
        shell: pwsh
        run: |
          $p = Join-Path $env:GITHUB_WORKSPACE $env:PROJECT_DIR
          Set-Location $p
          npm ci
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed"
          }

      - name: Build Android APK
        shell: pwsh
        run: |
          $p = Join-Path $env:GITHUB_WORKSPACE $env:PROJECT_DIR
          Set-Location $p
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-android.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Android APK build failed"
          }

      - name: Verify APK
        shell: pwsh
        run: |
          $apkPath = Join-Path $env:GITHUB_WORKSPACE "$env:PROJECT_DIR/artifacts/android"

          if (!(Test-Path $apkPath)) {
            throw "APK output folder missing"
          }

          $apk = @(Get-ChildItem $apkPath -Filter "*.apk" -File)

          if ($apk.Count -eq 0) {
            throw "APK file was not generated"
          }

          Write-Host "APK BUILD SUCCESSFUL"
          $apk | ForEach-Object { Write-Host $_.FullName }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DARK-MYRAA-ANDROID-APK
          path: ${{ env.PROJECT_DIR }}/artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 7
          
