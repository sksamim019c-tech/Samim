name: DARK MYRAA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Packages
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check Project Files
        shell: pwsh
        run: |
          if (!(Test-Path "myraa_exact")) {
            throw "ERROR: myraa_exact project folder is missing."
          }
          if (!(Test-Path "myraa_exact/package.json")) {
            throw "ERROR: package.json is missing."
          }
          if (!(Test-Path "myraa_exact/assets/characters/evelyn")) {
            throw "ERROR: Required assets/characters/evelyn files are missing. Restore the required project assets."
          }

      - name: Install Dependencies
        working-directory: myraa_exact
        run: npm ci

      - name: Build Android APK
        shell: pwsh
        run: |
          ./myraa_exact/scripts/build-android.ps1

      - name: Verify APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path "myraa_exact" -Filter "*.apk" -Recurse -File |
            Where-Object { $_.FullName -notmatch "\\node_modules\\" } |
            Select-Object -First 1

          if (!$apk) {
            throw "BUILD FAILED: No APK file was generated."
          }

          New-Item -ItemType Directory -Force -Path "myraa_exact/artifacts/android" | Out-Null
          Copy-Item $apk.FullName "myraa_exact/artifacts/android/DARK-MYRAA.apk" -Force

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DARK-MYRAA-ANDROID-APK
          path: myraa_exact/artifacts/android/DARK-MYRAA.apk
          if-no-files-found: error
          
