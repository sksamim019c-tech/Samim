name: DARK MYRAA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    name: Build DARK MYRAA Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Detect Project Folder
        shell: pwsh
        run: |
          if (Test-Path "myraa_exact/package.json") {
            "PROJECT_DIR=myraa_exact" >> $env:GITHUB_ENV
          }
          elseif (Test-Path "package.json") {
            "PROJECT_DIR=." >> $env:GITHUB_ENV
          }
          else {
            throw "Project package.json not found"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Verify Build Files
        shell: pwsh
        run: |
          $p = "$env:GITHUB_WORKSPACE/$env:PROJECT_DIR"

          if (!(Test-Path "$p/package-lock.json")) {
            throw "package-lock.json missing"
          }

          if (!(Test-Path "$p/scripts/build-android.ps1")) {
            throw "Android build script missing"
          }

          if (!(Test-Path "$p/assets/characters/evelyn")) {
            throw "Required licensed Evelyn model files are missing"
          }

      - name: Install Dependencies
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE/$env:PROJECT_DIR"
          npm ci
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed"
          }

      - name: Build Android APK
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE/$env:PROJECT_DIR"

          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-android.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "Android APK build failed"
          }

      - name: Verify APK
        shell: pwsh
        run: |
          $apkPath = "$env:GITHUB_WORKSPACE/$env:PROJECT_DIR/artifacts/android"

          if (!(Test-Path $apkPath)) {
            throw "APK output folder missing"
          }

          $apk = Get-ChildItem $apkPath -Filter "*.apk"

          if (!$apk) {
            throw "APK file was not generated"
          }

          Write-Host "APK BUILD SUCCESSFUL"
          $apk | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DARK-MYRAA-ANDROID-APK
          path: ${{ env.PROJECT_DIR }}/artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 7
          
