name: DARK MYRAA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    name: Build DARK MYRAA Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myraa_exact/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check Project Files
        shell: pwsh
        run: |
          if (!(Test-Path "myraa_exact/package.json")) {
            throw "Project folder or package.json is missing"
          }
          if (!(Test-Path "myraa_exact/scripts/build-android.ps1")) {
            throw "Android build script is missing"
          }
          if (!(Test-Path "myraa_exact/assets/characters/evelyn")) {
            throw "Required Evelyn model assets are missing"
          }

      - name: Install Dependencies
        working-directory: myraa_exact
        run: npm ci

      - name: Build Android APK
        working-directory: myraa_exact
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-android.ps1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARK-MYRAA-ANDROID-APK
          path: myraa_exact/artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 7
          
